services:
  mysql:
    image: mariadb:latest
    container_name: mysql_container
    environment:
      MYSQL_ROOT_PASSWORD: 12345
      MYSQL_DATABASE: ot
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - db_network

  phpmyadmin:
    image: phpmyadmin:latest 
    container_name: phpmyadmin_container
    environment:
      PMA_HOST: mysql
      UPLOAD_LIMIT: 64M 
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - db_network

volumes:
  mysql_data:

networks:
  db_network:
